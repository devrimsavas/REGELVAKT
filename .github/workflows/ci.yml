name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway PostgreSQL database that exists only during this run
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: regelvakt_test
        ports:
          - 5432:5432
        # Wait until the database accepts connections before the steps start
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Test settings; in CI they come from here instead of .env.test
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: regelvakt_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # Vitest compiles TypeScript without decorator metadata. This loads the
      # code compiled by tsc, so errors that only appear there fail the build.
      - name: Check that the compiled app loads
        run: node --input-type=module -e "await import('./dist/app.js')"

  # Builds the image and starts it with its database as docker-compose.yml
  # does, then waits until the API reports healthy: migrations ran and the
  # database answers
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Settings for the run
        run: |
          cp docker.env_example .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=ci-password/" .env
          sed -i "s/^SUBSCRIPTION_SECRET=.*/SUBSCRIPTION_SECRET=ci-secret-that-is-at-least-32-characters/" .env
          sed -i "s/^AI_PROVIDER=.*/AI_PROVIDER=/" .env
          sed -i "s/^KNOWLEDGE_UPDATES=.*/KNOWLEDGE_UPDATES=off/" .env

      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: The API answers
        run: curl --fail --silent http://127.0.0.1:3000/api/health

      - name: Logs
        if: always()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
