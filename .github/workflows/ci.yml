name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway PostgreSQL database that exists only during this run
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: regelvakt_test
        ports:
          - 5432:5432
        # Wait until the database accepts connections before the steps start
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Test settings; in CI they come from here instead of .env.test
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: regelvakt_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # Vitest compiles TypeScript without decorator metadata. This loads the
      # code compiled by tsc, so errors that only appear there fail the build.
      - name: Check that the compiled app loads
        run: node --input-type=module -e "await import('./dist/app.js')"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # The web app in a real browser, with the real API and database, and
  # stand-ins for Brønnøysundregistrene and the language model; every page
  # is also checked for accessibility (WCAG 2.2 AA) in light and dark mode
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: regelvakt_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json

      - name: Build the API
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Install the web app and the browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: web
        run: npm run e2e

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/e2e/.output
          retention-days: 7

  # Builds the images and starts them with the database as
  # docker-compose.yml does, then waits until all of them report healthy:
  # migrations ran, the database answers and the web app serves pages
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Settings for the run
        run: |
          cp docker.env_example .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=ci-password/" .env
          sed -i "s/^SUBSCRIPTION_SECRET=.*/SUBSCRIPTION_SECRET=ci-secret-that-is-at-least-32-characters/" .env
          sed -i "s/^AI_PROVIDER=.*/AI_PROVIDER=/" .env
          sed -i "s/^KNOWLEDGE_UPDATES=.*/KNOWLEDGE_UPDATES=off/" .env

      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: The API answers
        run: curl --fail --silent http://127.0.0.1:3000/api/health

      - name: The web app shows the front page
        run: curl --fail --silent http://127.0.0.1:3001/ | grep -q "Regelvakt"

      - name: Logs
        if: always()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
