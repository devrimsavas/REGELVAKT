# Regelvakt: the web app, the API and the database, the same on a laptop
# and on a server.
#
#   cp docker.env_example .env      # then fill it in
#   docker compose up -d --build
#
# The settings come from .env next to this file (never committed). The web
# app is reachable from this machine (127.0.0.1); on a server, a Cloudflare
# tunnel or a reverse proxy in front of it is what the internet sees. The
# web app calls the API inside Docker; the API's port on 127.0.0.1 is for
# Swagger and troubleshooting. PostgreSQL has no port outside Docker.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-regelvakt}
      POSTGRES_USER: ${DB_USER:-regelvakt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # The data outlives the container: removed only with "down -v"
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    image: regelvakt-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside Docker the database is the "db" service, whatever .env says
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-regelvakt}
      DB_USER: ${DB_USER:-regelvakt}
      PORT: "3000"
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    # Lets the API reach an Ollama running on this machine, outside Docker,
    # at http://host.docker.internal:11434 (Docker Desktop has it already)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The app finishes the running reminder or knowledge work in up to 30
    # seconds after it is told to stop; give it a little more than that
    stop_grace_period: 40s

  web:
    build: ./web
    image: regelvakt-web
    restart: unless-stopped
    environment:
      # The API inside Docker's network
      API_URL: http://api:3000
      # The header that holds the visitor's address (cf-connecting-ip
      # behind a Cloudflare tunnel); empty for X-Forwarded-For
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
